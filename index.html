<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勉強法診断</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .screen { display: none; }
        .active { display: block; }
        .btn { background: #4A90E2; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-top: 10px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h1>勉強法診断</h1>
        <p>あなたに合う方法を診断します</p>
        <button class="btn" onclick="startQuiz()">診断をはじめる</button>
    </div>

    <div id="quiz-screen" class="screen">
        <p id="question-text" style="font-weight:bold;"></p>
        <button class="btn" onclick="answer(true)">はい</button>
        <button class="btn" onclick="answer(false)" style="background:#ccc;">いいえ</button>
    </div>

    <div id="result-screen" class="screen">
        <h2>診断結果</h2>
        <h1 id="result-title" style="color:#4A90E2;"></h1>
        <p id="result-desc"></p>
        <button class="btn" onclick="location.reload()">最初からやり直す</button>
    </div>
</div>

<script>
    // ★自分のGASのURLをここに貼る
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwiGdUARaLiWZnMwtQEOWZMII_dVdEv2bmbfAOgZUQejjtgvuGoCfzfsLNl3b1dPSYF9A/exec';

    const questions = [
        { text: "図やイラストを見るのが好き？", type: "視覚型" },
        { text: "音読すると覚えやすい？", type: "聴覚型" },
        { text: "書いて覚えるのが得意？", type: "体験型" }
    ];

    let currentIdx = 0;
    let scores = { "視覚型": 0, "聴覚型": 0, "体験型": 0 };

    function startQuiz() {
        showScreen('quiz-screen');
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('question-text').innerText = questions[currentIdx].text;
    }

    function answer(isYes) {
        if (isYes) {
            scores[questions[currentIdx].type]++;
        }
        currentIdx++;
        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        // 先に結果を表示する（送信待ちで止まらないようにする）
        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        document.getElementById('result-title').innerText = winner;
        document.getElementById('result-desc').innerText = "あなたにはこのスタイルがおすすめです！";
        showScreen('result-screen');

        // データ送信（裏側でこっそりやる）
        if (GAS_URL) {
            const data = {
                timestamp: new Date().toLocaleString(),
                resultType: winner,
                device: navigator.userAgent
            };
            const params = new URLSearchParams();
            params.append('data', JSON.stringify(data));
            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: params });
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
